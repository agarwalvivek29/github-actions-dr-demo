# The switch. `kubectl -n dr-system patch cm dr-config -p '{"data":{"mode":"tekton"}}'`
#   auto   — follow the detectors (default)
#   tekton — force releases onto Tekton (declare the incident yourself)
#   gha    — force releases back onto GitHub Actions
apiVersion: v1
kind: ConfigMap
metadata: { name: dr-config, namespace: dr-system }
data:
  mode: auto
---
# Detector tuning. Demo values are aggressive so a drill fits on stage;
# the comments show what we'd run in prod.
apiVersion: v1
kind: ConfigMap
metadata: { name: dr-controller-env, namespace: dr-system }
data:
  # Drill: the fake status page. Prod: https://www.githubstatus.com/api/v2/components.json
  STATUS_URL: http://fake-status.dr-system.svc:8080/api/v2/components.json
  FAILOVER_ON: partial_outage,major_outage
  QUEUE_THRESHOLD: 60s      # prod: 10m
  FAILBACK_COOLDOWN: 60s    # prod: 15m
  HEALTH_INTERVAL: 5s       # prod: 30s
  POLL_INTERVAL: 5s         # prod: 15s
  WEBHOOK_GRACE: 20s        # prod: 60s
  GITHUB_WORKFLOW: release.yml
  GITHUB_BRANCH: main
  DASHBOARD_URL: http://localhost:9097
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: dr-controller, namespace: dr-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: dr-controller, namespace: ci }
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: dr-controller, namespace: ci }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dr-controller }
subjects: [{ kind: ServiceAccount, name: dr-controller, namespace: dr-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: dr-controller, namespace: dr-system }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dr-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: dr-controller, namespace: dr-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dr-controller }
subjects: [{ kind: ServiceAccount, name: dr-controller, namespace: dr-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: dr-controller-read-live, namespace: demo-prod }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: dr-controller-read-live, namespace: demo-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dr-controller-read-live }
subjects: [{ kind: ServiceAccount, name: dr-controller, namespace: dr-system }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dr-controller, namespace: dr-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: dr-controller } }
  template:
    metadata: { labels: { app: dr-controller } }
    spec:
      serviceAccountName: dr-controller
      containers:
        - name: dr-controller
          image: kind-registry:5000/dr-controller:dev
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: dr-controller-env }
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: GITHUB_APP_ID
              valueFrom: { secretKeyRef: { name: github-app, key: app-id } }
            - name: GITHUB_REPO
              valueFrom: { secretKeyRef: { name: github-app, key: repo } }
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: github-app, key: webhook-secret } }
          volumeMounts:
            - { name: github-app, mountPath: /etc/github-app, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
      volumes:
        - name: github-app
          secret:
            secretName: github-app
            items: [{ key: private-key.pem, path: private-key.pem }]
---
apiVersion: v1
kind: Service
metadata: { name: dr-controller, namespace: dr-system }
spec:
  type: NodePort
  selector: { app: dr-controller }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30090 }]
