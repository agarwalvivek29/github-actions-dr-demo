# Outage simulator: githubstatus.com's real feed with overrides you control.
apiVersion: apps/v1
kind: Deployment
metadata: { name: fake-status, namespace: dr-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: fake-status } }
  template:
    metadata: { labels: { app: fake-status } }
    spec:
      containers:
        - name: fake-status
          image: kind-registry:5000/dr-controller:dev
          imagePullPolicy: Always
          command: ["/usr/local/bin/fake-status"]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata: { name: fake-status, namespace: dr-system }
spec:
  type: NodePort
  selector: { app: fake-status }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30091 }]
